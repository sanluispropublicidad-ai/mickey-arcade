<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Emulator Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const core = urlParams.get('core') || 'gba';
    const rom = urlParams.get('rom') || 'roms/magical_quest_1.gba';
    const title = urlParams.get('title') || 'Juego Retro';

    // Resolver ruta absoluta de la ROM
    const absoluteRomUrl = new URL(rom, window.location.href).href;

    window.EJS_player = '#game';
    window.EJS_core = core;
    window.EJS_gameUrl = absoluteRomUrl;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_gameName = title;
    window.EJS_color = '#ef4444';
    window.EJS_startOnLoaded = true;
    window.EJS_virtualGamepad = true;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
